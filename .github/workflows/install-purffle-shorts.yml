name: Install and verify PurffleShorts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/install-purffle-shorts.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Khalifa's Shorts Studio
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install PurffleShorts with clipping support
        run: |
          python -m pip install --upgrade pip
          python -m pip install "purffle-shorts[clip,face] @ git+https://github.com/Chamanrajragu/purffle-shorts.git"

      - name: Verify installation
        run: |
          purffle-shorts --version
          purffle-shorts clip --help

